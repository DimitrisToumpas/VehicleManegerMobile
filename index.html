<!DOCTYPE html>
<html lang="el" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>KiniseosManager</title>

  <script src="https://cdn.jsdelivr.net/npm/eruda" crossorigin="anonymous"></script>
  <script>eruda.init();</script>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin="anonymous"></script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin="anonymous"></script>

  <script src="https://unpkg.com/@supabase/supabase-js@2" crossorigin="anonymous"></script>

  <script src="https://unpkg.com/lucide@latest" crossorigin="anonymous"></script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn { animation: fadeIn 0.2s ease-out forwards; }
  </style>
</head>
<body class="h-full bg-slate-100 font-sans text-slate-800 antialiased overflow-hidden select-none">

  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 📌 SUPABASE CONFIGURATION ---
    const SUPABASE_URL = "https://normavqmwvvihbaibggj.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_MnWmrENJ0WyoAXce7jVPWA_XO1wdfQO";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const MARKES = ['Mercedes-Benz', 'MAN', 'Iveco', 'Oshkosh', 'Liebherr', 'Caterpillar', 'Άλλο'];
    const CATEGORIES = [
      'Πολιτικά', 'Ρυμουλκά', 'Ανατρεπόμενα', 'Πυροσβεστικά',
      'Steyr', 'Καναδέζα GDT290', 'Καναδέζα GD290', 'JEEP', 'URAL',
      'M100', 'M104', 'TRAILOR Βαρκών', 'Λεωφορείο', 'Άλλο',
    ];
    const STATUSES = ['Με ζημιά', 'Χωρίς ζημιά'];


    // --- 🚗 1. COMPONENT: VEHICLE LIST ---
    function VehicleList({ onViewVehicle, onAddVehicle }) {
      const [vehicles, setVehicles] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        async function fetchVehicles() {
          try {
            const { data, error } = await supabase
              .from('vehicles')
              .select('*, vehicle_images(*)')
              .order('created_at', { ascending: false });
            if (error) throw error;
            setVehicles(data || []);
          } catch (err) {
            console.error("Fetch Vehicles Error:", err.message);
          } finally {
            setLoading(false);
          }
        }
        fetchVehicles();
      }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [vehicles, loading]);

      return (
        <div className="flex flex-col h-full animate-fadeIn">
          <div className="flex justify-between items-center mb-4 flex-shrink-0">
            <div>
              <h2 className="text-xl font-bold tracking-tight text-slate-900">Οχήματα Στόλου</h2>
              <p className="text-xs text-slate-500">Σύνολο: {vehicles.length}</p>
            </div>
            <button 
              onClick={onAddVehicle} 
              className="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-md shadow-blue-600/10 active:scale-95 transition-all flex items-center gap-1.5"
            >
              <i data-lucide="plus" className="w-4 h-4"></i> Νέο
            </button>
          </div>

          <div className="flex-1 overflow-y-auto pr-1 space-y-3 pb-6 no-scrollbar">
            {loading ? (
              <div className="flex justify-center items-center py-12 text-slate-400 text-sm">Φόρτωση οχημάτων...</div>
            ) : vehicles.length === 0 ? (
              <div className="text-center py-12 bg-white rounded-2xl border border-dashed border-slate-200 p-6">
                <p className="text-slate-400 text-sm">Δεν βρέθηκαν οχήματα στο στόλο.</p>
              </div>
            ) : (
              vehicles.map(vehicle => {
                const defaultImage = vehicle.vehicle_images?.find(i => i.is_default_photo) || vehicle.vehicle_images?.[0];
                return (
                  <div 
                    key={vehicle.id}
                    onClick={() => onViewVehicle(vehicle.id)}
                    className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4 active:bg-slate-50 transition-colors cursor-pointer"
                  >
                    <div className="w-16 h-16 bg-slate-100 rounded-xl overflow-hidden flex-shrink-0 flex items-center justify-center border border-slate-200/60">
                      {defaultImage?.image_url ? (
                        <img src={defaultImage.image_url} alt={vehicle.model} className="w-full h-full object-cover" />
                      ) : (
                        <i data-lucide="truck" className="w-6 h-6 text-slate-400"></i>
                      )}
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2">
                        <span className="font-mono bg-slate-900 text-white text-[11px] px-2 py-0.5 rounded font-bold tracking-wider">{vehicle.plate_number}</span>
                        <span className="text-xs font-semibold text-slate-500 truncate">{vehicle.marka}</span>
                      </div>
                      <h3 className="font-bold text-slate-800 text-base mt-0.5 truncate">{vehicle.model}</h3>
                      <p className="text-xs text-slate-400 mt-1 flex items-center gap-1">
                        <i data-lucide="gauge" className="w-3 h-3"></i> {vehicle.current_km?.toLocaleString()} χλμ
                      </p>
                    </div>
                    <i data-lucide="chevron-right" className="w-5 h-5 text-slate-300 flex-shrink-0"></i>
                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    }


    // --- 📸 2. COMPONENT: ADD VEHICLE ---
    function AddVehicle({ onSaved, onCancel }) {
      const [formData, setFormData] = useState({
        plate_number: '', brand: '', model: '', category: '', status: 'Χωρίς ζημιά',
        manufacture_year: '', current_km: '', vin: '', engine_number: '', notes: ''
      });
      const [imageFiles, setImageFiles] = useState([]);
      const [imagePreviews, setImagePreviews] = useState([]);
      const [saving, setSaving] = useState(false);
      const fileInputRef = useRef(null);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [imagePreviews]);

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const handleFileChange = (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        setImageFiles(prev => [...prev, ...files]);
        const newPreviews = files.map(file => URL.createObjectURL(file));
        setImagePreviews(prev => [...prev, ...newPreviews]);
      };

      const removeImage = (index) => {
        const updatedFiles = [...imageFiles];
        updatedFiles.splice(index, 1);
        setImageFiles(updatedFiles);

        const updatedPreviews = [...imagePreviews];
        URL.revokeObjectURL(updatedPreviews[index]);
        updatedPreviews.splice(index, 1);
        setImagePreviews(updatedPreviews);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!formData.plate_number || !formData.brand || !formData.model || !formData.category) {
          alert("Παρακαλώ συμπληρώστε όλα τα υποχρεωτικά πεδία.");
          return;
        }

        setSaving(true);
        try {
          // 1. Αποθήκευση στοιχείων οχήματος στον πίνακα 'vehicles'
          const { data: vehicleData, error: vehicleError } = await supabase
            .from('vehicles')
            .insert([{
              plate_number: formData.plate_number.toUpperCase().trim(),
              brand: formData.brand,
              model: formData.model.trim(),
              category: formData.category,
              status: formData.status,
              manufacture_year: formData.manufacture_year ? parseInt(formData.manufacture_year) : null,
              current_km: parseInt(formData.current_km) || 0,
              vin: formData.vin.toUpperCase().trim() || null,
              engine_number: formData.engine_number.toUpperCase().trim() || null,
              notes: formData.notes.trim() || null
            }])
            .select()
            .single();

          if (vehicleError) throw vehicleError;

          // 2. Ανέβασμα φωτογραφιών στο bucket 'vehicles'
          if (imageFiles.length > 0 && vehicleData) {
            for (let i = 0; i < imageFiles.length; i++) {
              const file = imageFiles[i];
              const fileExt = file.name.split('.').pop();
              const fileName = `${vehicleData.id}/${Math.random().toString(36).substring(2)}.${fileExt}`;
              const filePath = `photos/${fileName}`;

              // Ανέβασμα στο σωστό bucket
              const { error: uploadError } = await supabase.storage
                .from('vehicles')
                .upload(filePath, file);

              if (uploadError) throw uploadError;

              // Λήψη Public URL
              const { data: urlData } = supabase.storage
                .from('vehicles')
                .getPublicUrl(filePath);

              // Σύνδεση εικόνας με το όχημα στον πίνακα 'vehicle_images'
              const { error: imageDbError } = await supabase
                .from('vehicle_images')
                .insert([{
                  vehicle_id: vehicleData.id,
                  image_url: urlData.publicUrl,
                  is_default_photo: i === 0
                }]);

              if (imageDbError) throw imageDbError;
            }
          }

          onSaved();
        } catch (err) {
          console.error("Insert Vehicle Error:", err);
          alert("Σφάλμα αποθήκευσης: " + (err.message || "Παρακαλώ ελέγξτε την κονσόλα Eruda."));
        } finally {
          setSaving(false);
        }
      };

      return (
        <form onSubmit={handleSubmit} className="flex flex-col h-full animate-fadeIn">
          <div className="flex justify-between items-center mb-3 flex-shrink-0">
            <h2 className="text-xl font-bold text-slate-900">Νέο Όχημα</h2>
            <div className="flex gap-2">
              <button type="button" onClick={onCancel} className="px-3 py-1.5 text-sm font-medium text-slate-500 bg-white border border-slate-200 rounded-xl active:bg-slate-50">Ακύρωση</button>
              <button type="submit" disabled={saving} className="px-4 py-1.5 text-sm font-semibold text-white bg-blue-600 rounded-xl shadow-md shadow-blue-600/10 active:scale-95 disabled:opacity-50">
                {saving ? 'Αποθήκευση...' : 'Αποθήκευση'}
              </button>
            </div>
          </div>

          <div className="flex-1 overflow-y-auto pr-1 space-y-4 pb-8 no-scrollbar">
            
            {/* Ταυτότητα Οχήματος */}
            <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm space-y-3">
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Ταυτότητα Οχήματος</h3>
              <div>
                <label className="block text-xs font-semibold text-slate-500 mb-1">Πινακίδα Κυκλοφορίας *</label>
                <input type="text" name="plate_number" value={formData.plate_number} onChange={handleChange} required placeholder="π.χ. ΕΣ 12345" className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 font-mono uppercase" />
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-semibold text-slate-500 mb-1">Μάρκα *</label>
                  <select name="brand" value={formData.brand} onChange={handleChange} required className="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500">
                    <option value="">Επιλέξτε...</option>
                    {MARKES.map(m => <option key={m} value={m}>{m}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-500 mb-1">Μοντέλο *</label>
                  <input type="text" name="model" value={formData.model} onChange={handleChange} required placeholder="π.χ. 290GD" className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500" />
                </div>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-semibold text-slate-500 mb-1">Κατηγορία *</label>
                  <select name="category" value={formData.category} onChange={handleChange} required className="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500">
                    <option value="">Επιλέξτε...</option>
                    {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-500 mb-1">Κατάσταση</label>
                  <select name="status" value={formData.status} onChange={handleChange} className="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500">
                    {STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
              </div>
            </div>

            {/* Τεχνικά Στοιχεία */}
            <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm space-y-3">
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Τεχνικά Στοιχεία</h3>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-semibold text-slate-500 mb-1">Έτος Κατασκευής</label>
                  <input type="number" name="manufacture_year" value={formData.manufacture_year} onChange={handleChange} placeholder="1998" className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-500 mb-1">Τρέχοντα Χιλιόμετρα</label>
                  <input type="number" name="current_km" value={formData.current_km} onChange={handleChange} placeholder="0" className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500" />
                </div>
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-500 mb-1">Αριθμός Πλαισίου (VIN)</label>
                <input type="text" name="vin" value={formData.vin} onChange={handleChange} placeholder="VIN" className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm font-mono uppercase focus:outline-none focus:border-blue-500" />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-500 mb-1">Αριθμός Κινητήρα</label>
                <input type="text" name="engine_number" value={formData.engine_number} onChange={handleChange} placeholder="Αριθμός Κινητήρα" className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm font-mono uppercase focus:outline-none focus:border-blue-500" />
              </div>
            </div>

            {/* Παρατηρήσεις */}
            <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
              <label className="block text-xs font-semibold text-slate-500 mb-1">Σημειώσεις / Ιστορικό</label>
              <textarea name="notes" value={formData.notes} onChange={handleChange} rows="2" placeholder="Προσθέστε παρατηρήσεις..." className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 resize-none"></textarea>
            </div>

            {/* Φωτογραφίες Πολυμέσων */}
            <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm space-y-3">
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Πολυμέσα</h3>
              {imagePreviews.length === 0 ? (
                <div 
                  onClick={() => fileInputRef.current.click()}
                  className="w-full h-36 border-2 border-dashed border-slate-200 rounded-xl flex flex-col items-center justify-center gap-2 cursor-pointer bg-slate-50 active:bg-slate-100 transition-colors"
                >
                  <div className="p-3 bg-blue-50 text-blue-600 rounded-full">
                    <i data-lucide="image-plus" className="w-6 h-6"></i>
                  </div>
                  <span className="text-xs font-semibold text-slate-600">Προσθήκη Φωτογραφιών</span>
                  <span className="text-[10px] text-slate-400">Επιλογή από Συλλογή ή Κάμερα</span>
                </div>
              ) : (
                <div className="space-y-2">
                  <div className="grid grid-cols-4 gap-2">
                    {imagePreviews.map((url, index) => (
                      <div key={url} className="relative aspect-square rounded-lg overflow-hidden border border-slate-200">
                        <img src={url} alt="Preview" className="w-full h-full object-cover" />
                        <button 
                          type="button" 
                          onClick={() => removeImage(index)}
                          className="absolute top-1 right-1 bg-red-600 text-white p-1 rounded-full shadow flex items-center justify-center w-5 h-5"
                        >
                          <i data-lucide="x" className="w-3 h-3"></i>
                        </button>
                      </div>
                    ))}
                    <button 
                      type="button"
                      onClick={() => fileInputRef.current.click()}
                      className="aspect-square rounded-lg border-2 border-dashed border-slate-300 flex items-center justify-center bg-slate-50"
                    >
                      <i data-lucide="upload" className="w-5 h-5 text-slate-400"></i>
                    </button>
                  </div>
                </div>
              )}
              <input 
                type="file" 
                ref={fileInputRef} 
                onChange={handleFileChange} 
                accept="image/*" 
                multiple
                className="hidden" 
              />
            </div>
          </div>
        </form>
      );
    }


    
    // --- 🔧 3. COMPONENT: VEHICLE DETAIL ---
    function VehicleDetail({ vehicleId, onBack, onDeleted }) {
      const [vehicle, setVehicle] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        async function fetchVehicleDetail() {
          try {
            const { data, error } = await supabase
              .from('vehicles')
              .select('*, vehicle_images(*)')
              .eq('id', vehicleId)
              .single();
            if (error) throw error;
            setVehicle(data);
          } catch (err) {
            console.error("Detail Load Error:", err.message);
          } finally {
            setLoading(false);
          }
        }
        if (vehicleId) fetchVehicleDetail();
      }, [vehicleId]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [vehicle, loading]);

      const handleDelete = async () => {
        if (!confirm("Είστε σίγουροι ότι θέλετε να διαγράψετε αυτό το όχημα;")) return;
        try {
          const { error } = await supabase.from('vehicles').delete().eq('id', vehicleId);
          if (error) throw error;
          onDeleted();
        } catch (err) {
          alert("Σφάλμα διαγραφής: " + err.message);
        }
      };

      if (loading) return <div className="flex justify-center items-center h-full text-slate-400 text-sm">Φόρτωση στοιχείων...</div>;
      if (!vehicle) return <div className="text-center py-12 text-slate-500">Το όχημα δεν βρέθηκε.</div>;

      const defaultImage = vehicle.vehicle_images?.find(i => i.is_default_photo) || vehicle.vehicle_images?.[0];

      return (
        <div className="flex flex-col h-full animate-fadeIn">
          <div className="flex justify-between items-center mb-3 flex-shrink-0">
            <button onClick={onBack} className="text-sm font-semibold text-blue-600 flex items-center gap-1 active:opacity-60">
              <i data-lucide="chevron-left" className="w-4 h-4"></i> Πίσω
            </button>
            <button onClick={handleDelete} className="text-sm font-semibold text-red-600 flex items-center gap-1 active:opacity-60">
              <i data-lucide="trash-2" className="w-4 h-4"></i> Διαγραφή
            </button>
          </div>

          <div className="flex-1 overflow-y-auto pr-1 space-y-4 pb-8 no-scrollbar">
            <div className="bg-white rounded-2xl overflow-hidden border border-slate-100 shadow-sm">
              <div className="w-full h-48 bg-slate-100 relative border-b border-slate-100 flex items-center justify-center">
                {defaultImage?.image_url ? (
                  <img src={defaultImage.image_url} alt={vehicle.model} className="w-full h-full object-cover" />
                ) : (
                  <i data-lucide="truck" className="w-12 h-12 text-slate-300"></i>
                )}
                <div className="absolute bottom-3 left-3 bg-slate-900 text-white font-mono text-xs px-2.5 py-1 rounded-lg font-bold tracking-wider shadow-md">
                  {vehicle.plate_number}
                </div>
              </div>
              <div className="p-4">
                <span className="text-xs font-bold text-blue-600 uppercase tracking-wide">{vehicle.brand}</span>
                <h2 className="text-xl font-bold text-slate-800 mt-0.5">{vehicle.model} ({vehicle.manufacture_year || 'N/A'})</h2>
              </div>
            </div>

            <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm space-y-3">
              <div className="flex justify-between border-b border-slate-50 pb-2">
                <span className="text-sm text-slate-500 font-medium">Κατηγορία</span>
                <span className="text-sm font-bold text-slate-800">{vehicle.category}</span>
              </div>
              <div className="flex justify-between border-b border-slate-50 pb-2">
                <span className="text-sm text-slate-500 font-medium">Κατάσταση</span>
                <span className={`text-sm font-bold ${vehicle.status === 'Με ζημιά' ? 'text-red-600' : 'text-green-600'}`}>{vehicle.status}</span>
              </div>
              <div className="flex justify-between border-b border-slate-50 pb-2">
                <span className="text-sm text-slate-500 font-medium">Τρέχοντα Χιλιόμετρα</span>
                <span className="text-sm font-bold text-slate-800">{vehicle.current_km?.toLocaleString()} χλμ</span>
              </div>
              {vehicle.vin && (
                <div className="flex justify-between border-b border-slate-50 pb-2">
                  <span className="text-sm text-slate-500 font-medium">VIN</span>
                  <span className="text-sm font-mono text-slate-800 uppercase">{vehicle.vin}</span>
                </div>
              )}
            </div>

            {vehicle.notes && (
              <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Σημειώσεις</h4>
                <p className="text-sm text-slate-600 leading-relaxed bg-slate-50 p-2.5 rounded-xl border border-slate-100">{vehicle.notes}</p>
              </div>
            )}
          </div>
        </div>
      );
    }


    // --- 📅 4. COMPONENT: SERVICE LIST ---
    function ServiceList() {
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, []);

      return (
        <div className="flex flex-col h-full animate-fadeIn">
          <div className="mb-4 flex-shrink-0">
            <h2 className="text-xl font-bold tracking-tight text-slate-900">Πρόγραμμα Συντηρήσεων</h2>
            <p className="text-xs text-slate-400">Εκκρεμή και προγραμματισμένα σέρβις</p>
          </div>
          <div className="text-center py-12 bg-white rounded-2xl border border-dashed border-slate-200 p-6">
            <p className="text-slate-400 text-sm">Το πλάνο συντηρήσεων είναι προσβάσιμο μέσω των λεπτομερειών κάθε οχήματος.</p>
          </div>
        </div>
      );
    }


    // --- 📱 5. MAIN APPLICATION CONTAINER ---
    function App() {
      const [currentView, setCurrentView] = useState('list');
      const [selectedVehicleId, setSelectedVehicleId] = useState(null);

      function navigateToList() { setSelectedVehicleId(null); setCurrentView('list'); }
      function navigateToDetail(id) { setSelectedVehicleId(id); setCurrentView('detail'); }
      function navigateToAdd() { setCurrentView('add'); }
      function navigateToServices() { setCurrentView('services'); }

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [currentView]);

      return (
        <div className="h-full flex flex-col md:flex-row bg-slate-100 relative">
          
          {/* Sidebar */}
          <aside className="w-full md:w-64 bg-slate-900 text-white flex flex-col flex-shrink-0 border-b md:border-b-0 md:border-r border-slate-800 shadow-xl z-20">
            <div className="p-4 md:p-5 border-b border-slate-800 flex items-center justify-between bg-slate-950">
              <div className="flex items-center gap-3 min-w-0">
                <div className="p-2 bg-blue-600 rounded-xl text-white flex-shrink-0 shadow-lg shadow-blue-600/30">
                  <i data-lucide="truck" className="w-5 h-5"></i>
                </div>
                <div className="min-w-0">
                  <h1 className="font-black text-base tracking-wide text-white leading-tight truncate">KiniseosManager</h1>
                  <p className="text-[10px] text-slate-400 font-medium">Στρατιωτική Έκδοση v1.2</p>
                </div>
              </div>
            </div>

            <nav className="p-2 md:p-4 space-x-1 md:space-x-0 md:space-y-1.5 flex flex-row md:flex-col overflow-x-auto no-scrollbar flex-1 items-center md:items-stretch">
              <button onClick={navigateToList} className={`flex items-center gap-2.5 px-4 py-2.5 md:py-3 rounded-xl text-xs md:text-sm font-semibold transition-all flex-1 md:flex-initial justify-center md:justify-start ${currentView === 'list' || currentView === 'detail' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800/60'}`}>
                <i data-lucide="layout-dashboard" className="w-4 h-4 flex-shrink-0"></i>
                <span className="whitespace-nowrap">Οχήματα</span>
              </button>

              <button onClick={navigateToServices} className={`flex items-center gap-2.5 px-4 py-2.5 md:py-3 rounded-xl text-xs md:text-sm font-semibold transition-all flex-1 md:flex-initial justify-center md:justify-start ${currentView === 'services' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800/60'}`}>
                <i data-lucide="wrench" className="w-4 h-4 flex-shrink-0"></i>
                <span className="whitespace-nowrap">Σέρβις</span>
              </button>

              <button onClick={navigateToAdd} className={`flex items-center gap-2.5 px-4 py-2.5 md:py-3 rounded-xl text-xs md:text-sm font-semibold transition-all flex-1 md:flex-initial justify-center md:justify-start ${currentView === 'add' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800/60'}`}>
                <i data-lucide="plus-circle" className="w-4 h-4 flex-shrink-0"></i>
                <span className="whitespace-nowrap">Προσθήκη</span>
              </button>
            </nav>
          </aside>

          {/* Κύριο Πλαίσιο */}
          <main className="flex-1 p-4 md:p-6 overflow-hidden max-w-4xl mx-auto w-full flex flex-col relative z-10">
            <div className="flex-1 overflow-hidden h-full">
              {currentView === 'list' && <VehicleList onViewVehicle={navigateToDetail} onAddVehicle={navigateToAdd} />}
              {currentView === 'add' && <AddVehicle onSaved={navigateToList} onCancel={navigateToList} />}
              {currentView === 'detail' && <VehicleDetail vehicleId={selectedVehicleId} onBack={navigateToList} onDeleted={navigateToList} />}
              {currentView === 'services' && <ServiceList />}
            </div>
          </main>
        </div>
      );
    }

    // --- 🚀 INITIALIZATION & RENDER ---
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
