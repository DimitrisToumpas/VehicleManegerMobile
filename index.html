  <script type="text/babel">

    // --- 📸 2. COMPONENT: ADD VEHICLE ---
    function AddVehicle({ onSaved, onCancel }) {
      const [formData, setFormData] = useState({
        license_plate: '', brand: '', model: '', year: new Date().getFullYear(),
        current_km: '', next_service_date: '', next_service_km: '', notes: ''
      });
      const [imageFile, setImageFile] = useState(null);
      const [imagePreview, setImagePreview] = useState(null);
      const [saving, setSaving] = useState(false);
      const fileInputRef = useRef(null);

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const handleFileChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          setImageFile(file);
          setImagePreview(URL.createObjectURL(file));
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!formData.license_plate || !formData.brand || !formData.model) {
          alert("Παρακαλώ συμπληρώστε τα βασικά στοιχεία (Πινακίδα, Μάρκα, Μοντέλο)");
          return;
        }

        setSaving(true);
        try {
          let photo_url = null;

          if (imageFile) {
            const fileExt = imageFile.name.split('.').pop();
            const fileName = `${Math.random()}.${fileExt}`;
            const filePath = `vehicle-photos/${fileName}`;

            const { error: uploadError } = await supabase.storage
              .from('fleet-media')
              .upload(filePath, imageFile);

            if (uploadError) throw uploadError;

            const { data: urlData } = supabase.storage
              .from('fleet-media')
              .getPublicUrl(filePath);
              
            photo_url = urlData.publicUrl;
          }

          const { error } = await supabase.from('vehicles').insert([{
            license_plate: formData.license_plate.toUpperCase(),
            brand: formData.brand,
            model: formData.model,
            year: parseInt(formData.year) || null,
            current_km: parseInt(formData.current_km) || 0,
            next_service_date: formData.next_service_date || null,
            next_service_km: parseInt(formData.next_service_km) || null,
            notes: formData.notes,
            photo_url: photo_url
          }]);

          if (error) throw error;
          onSaved();
        } catch (err) {
          console.error("Error saving vehicle:", err.message);
          alert("Σφάλμα κατά την αποθήκευση: " + err.message);
        } finally {
          setSaving(false);
        }
      };

      return (
        <form onSubmit={handleSubmit} className="flex flex-col h-full animate-fadeIn">
          <div className="flex justify-between items-center mb-3 flex-shrink-0">
            <h2 className="text-xl font-bold text-slate-900">Νέο Όχημα</h2>
            <div className="flex gap-2">
              <button type="button" onClick={onCancel} className="px-3 py-1.5 text-sm font-medium text-slate-500 bg-white border border-slate-200 rounded-xl active:bg-slate-50">Ακύρωση</button>
              <button type="submit" disabled={saving} className="px-4 py-1.5 text-sm font-semibold text-white bg-blue-600 rounded-xl shadow-md shadow-blue-600/10 active:scale-95 disabled:opacity-50">
                {saving ? 'Αποθήκευση...' : 'Αποθήκευση'}
              </button>
            </div>
          </div>

          <div className="flex-1 overflow-y-auto pr-1 space-y-4 pb-8 no-scrollbar">
            {/* Φωτογραφία Κινητού */}
            <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-col items-center justify-center text-center">
              {imagePreview ? (
                <div className="relative w-full h-44 rounded-xl overflow-hidden group">
                  <img src={imagePreview} alt="Preview" className="w-full h-full object-cover" />
                  <button 
                    type="button" 
                    onClick={() => { setImageFile(null); setImagePreview(null); }}
                    className="absolute top-2 right-2 bg-red-600 text-white p-1.5 rounded-full shadow"
                  >
                    <i data-lucide="trash-2" className="w-4 h-4"></i>
                  </button>
                </div>
              ) : (
                <div 
                  onClick={() => fileInputRef.current.click()}
                  className="w-full h-36 border-2 border-dashed border-slate-200 rounded-xl flex flex-col items-center justify-center gap-2 cursor-pointer bg-slate-50 active:bg-slate-100 transition-colors"

                    <i data-lucide="camera" className="w-6 h-6"></i>
                  </div>
                  <span className="text-xs font-semibold text-slate-600">Προσθήκη Φωτογραφίας από Κινητό</span>
                  <span className="text-[10px] text-slate-400">Κάμερα ή Συλλογή</span>
                </div>
              )}
              <input 
                type="file" 
                ref={fileInputRef} 
                onChange={handleFileChange} 
                accept="image/*" 
                capture="environment" 
                className="hidden" 
              />
            </div>

            {/* Στοιχεία */}
            <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm space-y-3">
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Βασικές Πληροφορίες</h3>
              <div>
                <label className="block text-xs font-semibold text-slate-500 mb-1">Πινακίδα Κυκλοφορίας *</label>
                <input type="text" name="license_plate" value={formData.license_plate} onChange={handleChange} required placeholder="XYZ1234" className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 font-mono uppercase" />
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-semibold text-slate-500 mb-1">Μάρκα *</label>
                  <input type="text" name="brand" value={formData.brand} onChange={handleChange} required placeholder="Toyota" className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-500 mb-1">Μοντέλο *</label>
                  <input type="text" name="model" value={formData.model} onChange={handleChange} required placeholder="Yaris" className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500" />
                </div>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-semibold text-slate-500 mb-1">Έτος Κατασκευής</label>
                  <input type="number" name="year" value={formData.year} onChange={handleChange} className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500" />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-500 mb-1">Τρέχοντα Χιλιόμετρα</label>
                  <input type="number" name="current_km" value={formData.current_km} onChange={handleChange} placeholder="120000" className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500" />
                </div>
              </div>
            </div>

            {/* Service */}
            <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm space-y-3">
              <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Προγραμματισμός Σέρβις</h3>
              <div>
                <label className="block text-xs font-semibold text-slate-500 mb-1">Ημερομηνία Επόμενου Σέρβις</label>
                <input type="date" name="next_service_date" value={formData.next_service_date} onChange={handleChange} className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 text-slate-700" />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-500 mb-1">Χιλιόμετρα Επόμενου Σέρβις</label>
                <input type="number" name="next_service_km" value={formData.next_service_km} onChange={handleChange} placeholder="130000" className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500" />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-500 mb-1">Σημειώσεις / Παρατηρήσεις</label>
                <textarea name="notes" value={formData.notes} onChange={handleChange} rows="2" placeholder="Αλλαγή φίλτρων, λάδια κλπ..." className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 resize-none"></textarea>
              </div>
            </div>
          </div>
        </form>
      );
    }

              .select('*')
              .eq('id', vehicleId)
              .single();
            if (error) throw error;
            setVehicle(data);
          } catch (err) {
            console.error("Error loading details:", err.message);
          } finally {
            setLoading(false);
          }
        }
        if (vehicleId) fetchVehicleDetail();
      }, [vehicleId]);

      const handleDelete = async () => {
        if (!confirm("Είστε σίγουροι ότι θέλετε να διαγράψετε αυτό το όχημα;")) return;
        try {
          const { error } = await supabase.from('vehicles').delete().eq('id', vehicleId);
          if (error) throw error;
          onDeleted();
        } catch (err) {
          alert("Σφάλμα διαγραφής: " + err.message);
        }
      };

      if (loading) return <div className="flex justify-center items-center h-full text-slate-400 text-sm">Φόρτωση στοιχείων...</div>;
      if (!vehicle) return <div className="text-center py-12 text-slate-500">Το όχημα δεν βρέθηκε.</div>;

              <i data-lucide="chevron-left" className="w-4 h-4"></i> Πίσω
            </button>
            <button onClick={handleDelete} className="text-sm font-semibold text-red-600 flex items-center gap-1 active:opacity-60">
              <i data-lucide="trash-2" className="w-4 h-4"></i> Διαγραφή
            </button>
          </div>

                <span className="text-sm font-bold text-slate-800">{vehicle.current_km?.toLocaleString()} χλμ</span>
              </div>
              <div className="flex justify-between border-b border-slate-50 pb-2">

            </div>

            {vehicle.notes && (
              <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                <h4 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Σημειώσεις</h4>
                <p className="text-sm text-slate-600 leading-relaxed bg-slate-50 p-2.5 rounded-xl border border-slate-100">{vehicle.notes}</p>
              </div>
            )}
          </div>
        </div>
      );
    }


    // --- 📅 4. COMPONENT: SERVICE LIST ---
    function ServiceList() {
      const [services, setServices] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        async function fetchUpcomingServices() {
          try {
            const { data, error } = await supabase
              .from('vehicles')
              .select('id, license_plate, brand, model, next_service_date, next_service_km')
              .not('next_service_date', 'is', null)
              .order('next_service_date', { ascending: true });
            if (error) throw error;
            setServices(data || []);
          } catch (err) {
            console.error("Error fetching services:", err.message);
          } finally {
            setLoading(false);
          }
        }
        fetchUpcomingServices();
      }, []);

      return (
        <div className="flex flex-col h-full animate-fadeIn">
          <div className="mb-4 flex-shrink-0">
            <h2 className="text-xl font-bold tracking-tight text-slate-900">Πρόγραμμα Συντηρήσεων</h2>
            <p className="text-xs text-slate-400">Επόμενα προγραμματισμένα σέρβις</p>
          </div>

          <div className="flex-1 overflow-y-auto pr-1 space-y-3 pb-6 no-scrollbar">
            {loading ? (
              <div className="flex justify-center items-center py-12 text-slate-400 text-sm">Φόρτωση ημερομηνιών...</div>
            ) : services.length === 0 ? (
              <div className="text-center py-12 bg-white rounded-2xl border border-dashed border-slate-200 p-6">
                <p className="text-slate-400 text-sm">Δεν υπάρχουν εκκρεμή σέρβις.</p>
              </div>
            ) : (
              services.map(item => (
                <div key={item.id} className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between gap-3">
                  <div className="min-w-0">
                    <div className="flex items-center gap-1.5">
                      <span className="font-mono bg-slate-100 text-slate-700 text-[10px] px-1.5 py-0.5 rounded font-bold tracking-wider border border-slate-200/50">{item.license_plate}</span>
                      <span className="text-xs text-slate-500 font-medium truncate">{item.brand} {item.model}</span>
                    </div>
                    <div className="mt-2 flex items-center gap-1 text-slate-700 text-sm font-bold">
                      <i data-lucide="calendar" className="w-4 h-4 text-blue-500 flex-shrink-0"></i>
                      <span>{new Date(item.next_service_date).toLocaleDateString('el-GR')}</span>
                    </div>
                  </div>
                  {item.next_service_km && (
                    <div className="text-right flex-shrink-0">
                      <span className="text-[10px] block font-semibold text-slate-400 uppercase">Στα χλμ</span>
                      <span className="text-xs font-bold text-slate-600">{item.next_service_km?.toLocaleString()}</span>
                    </div>
                  )}
                </div>
              ))
            )}
          </div>
        </div>
      );
    }


    // --- 📱 5. MAIN NAVIGATION CONTAINER (APP) ---
    function App() {
      const [currentView, setCurrentView] = useState('list');
      const [selectedVehicleId, setSelectedVehicleId] = useState(null);

      function navigateToList() { setSelectedVehicleId(null); setCurrentView('list'); }
      function navigateToDetail(id) { setSelectedVehicleId(id); setCurrentView('detail'); }
      function navigateToAdd() { setCurrentView('add'); }
      function navigateToServices() { setCurrentView('services'); }

      // Επανενεργοποίηση εικονιδίων Lucide σε κάθε αλλαγή view
      useEffect(() => {
        lucide.createIcons();
      }, [currentView]);

      return (
        <div className="h-full flex flex-col md:flex-row bg-slate-100">
          
          {/* Sidebar / Topbar για Κινητά */}
          <aside className="w-full md:w-64 bg-slate-900 text-white flex flex-col flex-shrink-0 border-b md:border-b-0 md:border-r border-slate-800 shadow-xl z-20">
            <div className="p-4 md:p-5 border-b border-slate-800 flex items-center gap-3 bg-slate-950">
              <div className="p-2 bg-blue-600 rounded-xl text-white flex-shrink-0 shadow-lg shadow-blue-600/30">
                <i data-lucide="truck" className="w-5 h-5"></i>
              </div>
              <div className="min-w-0">
                <h1 className="font-black text-base tracking-wide text-white leading-tight truncate">KiniseosManager</h1>
                <p className="text-[10px] text-slate-400 font-medium">Στρατιωτική Έκδοση v1.1</p>
              </div>
            </div>

            <nav className="p-2 md:p-4 space-x-1 md:space-x-0 md:space-y-1.5 flex flex-row md:flex-col overflow-x-auto no-scrollbar flex-1 items-center md:items-stretch">
              <button 
                onClick={navigateToList} 
                className={`flex items-center gap-2.5 px-4 py-2.5 md:py-3 rounded-xl text-xs md:text-sm font-semibold transition-all flex-1 md:flex-initial justify-center md:justify-start ${currentView === 'list' || currentView === 'detail' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/20' : 'text-slate-400 hover:bg-slate-800/60'}`}
              >
                <i data-lucide="layout-dashboard" className="w-4 h-4 flex-shrink-0"></i>
                <span className="whitespace-nowrap">Οχήματα</span>
              </button>

              <button 
                onClick={navigateToServices} 
                className={`flex items-center gap-2.5 px-4 py-2.5 md:py-3 rounded-xl text-xs md:text-sm font-semibold transition-all flex-1 md:flex-initial justify-center md:justify-start ${currentView === 'services' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/20' : 'text-slate-400 hover:bg-slate-800/60'}`}
              >
                <i data-lucide="wrench" className="w-4 h-4 flex-shrink-0"></i>
                <span className="whitespace-nowrap">Σέρβις</span>
              </button>

              <button 
                onClick={navigateToAdd} 
                className={`flex items-center gap-2.5 px-4 py-2.5 md:py-3 rounded-xl text-xs md:text-sm font-semibold transition-all flex-1 md:flex-initial justify-center md:justify-start ${currentView === 'add' ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/20' : 'text-slate-400 hover:bg-slate-800/60'}`}
              >
                <i data-lucide="plus-circle" className="w-4 h-4 flex-shrink-0"></i>
                <span className="whitespace-nowrap">Προσθήκη</span>
              </button>
            </nav>
          </aside>

          {/* Κύριο Πλαίσιο - 100% Ύψος χωρίς εξωτερικά scrollbars */}
          <main className="flex-1 p-4 md:p-6 overflow-hidden max-w-4xl mx-auto w-full flex flex-col relative z-10">
            <div className="flex-1 overflow-hidden h-full">
              {currentView === 'list' && <VehicleList onViewVehicle={navigateToDetail} onAddVehicle={navigateToAdd} />}
              {currentView === 'add' && <AddVehicle onSaved={navigateToList} onCancel={navigateToList} />}
              {currentView === 'detail' && <VehicleDetail vehicleId={selectedVehicleId} onBack={navigateToList} onDeleted={navigateToList} />}
              {currentView === 'services' && <ServiceList />}
            </div>
          </main>
        </div>
      );
    }

    // --- 🚀 INITIALIZATION & RENDER ---
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
